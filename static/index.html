<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="utf-8" />
    <title>FangstPlot</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="/static/css/stil.css" />
</head>
<body>

<div id="kart-ramme">
    <div id="map"></div>
    <h1 id="overskrift">FangstPlot</h1>
    <div id="kontrollar">
        <span id="result"></span>
    </div>
    <div id="trekk-panel" hidden>
        <h2>Registrer trekk</h2>
        <div id="trekk-posisjon"></div>

        <label>Stod ute
            <select id="trekk-staatid">
                <option value="1">1 døgn</option>
                <option value="2">2 døgn</option>
                <option value="3">3 døgn</option>
                <option value="4">4 døgn</option>
                <option value="5">5 døgn eller meir</option>
            </select>
        </label>

        <label>Djupne (m)
            <input type="number" id="trekk-djupne" step="0.5" min="0" />
        </label>

        <label>Hummar totalt
            <input type="number" id="trekk-total" min="0" value="0" />
        </label>

        <label>Undermåls
            <input type="number" id="trekk-undermaals" min="0" value="0" />
        </label>

        <div id="trekk-knappar">
            <button id="trekk-lagre">Lagre</button>
            <button id="trekk-avbryt">Avbryt</button>
        </div>
        <div id="trekk-feil"></div>
    </div>
</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script src="/static/js/kart.js"></script>
<script src="/static/js/grid.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/trekk.js"></script>

</body>
</html>
